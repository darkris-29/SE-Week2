<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopZone — Our Products</title>
<link rel="Stylesheet" href="style.css">
<!-- ===== Insert Stylesheet ===== -->

</head>
<body>

<!-- ===== Header ===== -->
 <header class="site-header">
    <div class="wrap">
        <div class="navbar">
            <div class="logo">
                Shop<span class="accent">Zone</span>
            </div>
            <div class="nav-links">
                <nav><a href="index.html" >Home</a></nav>
                <nav><a href="products.html class="current"" >Products</a></nav>
                <nav><a href="#" >Contact us</a></nav>

            </div>
        </div>
    </div>
 </header>


        
    

<!-- ===== Page Banner ===== -->
 <div class="page-banner">
 <h1>Our Products</h1>
 <div class="breadcrumb">
 <a href="index.html">Home</a>
 > products
</div>
</div>
<!-- ===== Filter Bar ===== -->
 <div class="filter-bar">
 <label>All products</label>
 <select>
    <option>Elctronics</option>
    <option>Footwear</option>
    <option>photography</option>
 </select>
  </div>

<!-- ===== Product Grid ===== -->
 <section class="product-grid">
    <div class="product-card">
        <img src="images/wireless-headphones.png" class="product-card img">
        <div class="product-info">
            <h4>Wireless headphones</h4>
        
        <div class="stars">

        </div>
        <div class="price-row">
            <span class="price">$349</span>
            <span class="old-price">$500</span>
            <span class="off">22%</span>
        </div>
        <button class="add-cart-btn">
            Add to cart
        </button>
        </div>
    </div>
 </section>

  
<!-- ===== Footer ===== -->


</body>
</html>
